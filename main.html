<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elementok Selector</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>

    <div class="main">
        <div class="left">
            <a data-index="0">pula</a>
            <a data-index="1">pizda</a>
            <a data-index="2">coaie</a>
            <a data-index="3">cacat</a>
            <a data-index="4">cacat 2</a>
            <a data-index="5">test div1</a>
            <a data-index="6">test div2</a>
            <a data-index="7">test div3</a>
        </div>

        <div class="right">
            <div class="item"><img src="images/photo1.png" alt="Photo 1"></div>
            <div class="item"><img src="images/photo2.png" alt="Photo 2"></div>
            <div class="item"><img src="images/photo3.png" alt="Photo 3"></div>
            <div class="item"><img src="images/photo4.png" alt="Photo 4"></div>
            <div class="item"><img src="images/photo5.png" alt="Photo 5"></div>
            <div class="item" style="background: red;"></div>
            <div class="item" style="background: green;"></div>
            <div class="item" style="background: blue;"></div>
        </div>
    </div>

</body>
</html>
